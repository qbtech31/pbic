name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Init
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.REP_YOL }}
          token: ${{ secrets.REP_TOKEN }}

      - name: Env1
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Env2
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Exec
        env:
          KEY_1: ${{ secrets.KEY_1 }}
          KEY_2: ${{ secrets.KEY_2 }}
          KEY_3: ${{ secrets.KEY_3 }}
          KEY_4: ${{ secrets.KEY_4 }}
          KEY_5: ${{ secrets.KEY_5 }}
          KEY_6: ${{ secrets.KEY_6 }}
        run: bash worker.sh 
