name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Init
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.REP_YOL }}
          token: ${{ secrets.REP_TOKEN }}

      - name: Env1
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Env2
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Exec
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          TARGET_GROUP: ${{ secrets.TARGET_GROUP }}
          TOPIC_ID: ${{ secrets.TOPIC_ID }}
          CF_COOKIE: ${{ secrets.CF_COOKIE }}
        run: bash worker.sh # Her şey burada, gizli deponda oluyor!
